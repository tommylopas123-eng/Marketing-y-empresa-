<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F4F4F2"/>
  <!-- Minimalista: wordmark con hilo que atraviesa -->
  <text x="400" y="400" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="900" letter-spacing="-2" fill="#0A0A0A">KORMAN</text>
  <!-- hilo cosido que cruza la palabra -->
  <path d="M150 360 q125 -40 250 0 t250 0" fill="none" stroke="#C9A24B"
