  <circle cx="150" cy="360" r="7" fill="#C9A24B"/>
  <circle cx="650" cy="360" r="7" fill="#C9A24B"/>
  <text x="400" y="452" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" letter-spacing="14" fill="#0A0A0A">ETIQUETAS BORDADAS</text>
</svg>
