<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F4F4F2"/>
  <!-- Etiqueta colgante (hang tag) inclinada -->
  <g transform="rotate(-10 400 400)">
    <!-- cuerpo de la etiqueta -->
    <path d="M250 260 L550 260 L550 540 Q400 585 250 540 Z" fill="#0A0A0A"/>
    <!-- ojal superior -->
    <circle cx="400" cy="300" r="15" fill="none" stroke="#F4F4F2" stroke-width="6"/>
    <!-- hilo del ojal -->
    <path d="M400 285 C368 245 432 225 400 195" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
    <!-- texto en la etiqueta -->
    <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="52" font-weight="800" letter-spacing="1" fill="#F4F4F2">KORMAN</text>
    <line x1="335" y1="452" x2="465" y2="452" stroke="#C9A24B" stroke-width="3"/>
    <text x="400" y="492" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="18" letter-spacing="5" fill="#C9A24B">BORDADAS</text>
  </g>
</svg>
