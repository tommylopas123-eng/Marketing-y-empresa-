<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <pattern id="linen2" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F1EBDE"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#linen2)"/>
  <!-- numero editorial centrado -->
  <text x="540" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="130" fill="#A9854E">01</text>
  <text x="540" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="9" fill="#20201D" fill-opacity="0.55">GUÍA</text>
  <line x1="440" y1="395" x2="640" y2="395" stroke="#20201D" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- titular centrado -->
  <text x="540" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="62" fill="#20201D">Por qué tu marca</text>
  <text x="540" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="62" fill="#20201D">necesita su propia</text>
  <text x="540" y="654" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-style="italic" fill="#A9854E">etiqueta.</text>
  <!-- cuerpo centrado -->
  <text x="540" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#20201D" fill-opacity="0.8">Una etiqueta bordada con tu logo eleva</text>
  <text x="540" y="813" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#20201D" fill-opacity="0.8">la percepción de tu prenda. Comunica</text>
  <text x="540" y="856" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#20201D" fill-opacity="0.8">calidad antes de la primera palabra.</text>
</svg>
