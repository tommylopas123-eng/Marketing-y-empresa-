<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F1EBDE"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#linen)"/>
  <rect x="64" y="64" width="952" height="952" fill="none" stroke="#20201D" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- eyebrow descriptivo -->
  <text x="540" y="360" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" letter-spacing="11" fill="#A9854E">ETIQUETAS BORDADAS</text>
  <!-- titular centrado -->
  <text x="540" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" fill="#20201D">El detalle</text>
  <text x="540" y="625" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" fill="#20201D">que convierte una prenda</text>
  <text x="540" y="710" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" font-style="italic" fill="#A9854E">en una marca.</text>
  <!-- acento hilo -->
  <line x1="490" y1="765" x2="590" y2="765" stroke="#A9854E" stroke-width="1.5"/>
</svg>
