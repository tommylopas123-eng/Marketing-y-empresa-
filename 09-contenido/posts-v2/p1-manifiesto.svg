<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <pattern id="linen" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F1EBDE"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#000000" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#linen)"/>
  <!-- keyline editorial -->
  <rect x="64" y="64" width="952" height="952" fill="none" stroke="#20201D" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- label superior -->
  <text x="540" y="170" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" letter-spacing="11" fill="#A9854E">ATELIER DE ETIQUETAS BORDADAS</text>
  <line x1="465" y1="200" x2="615" y2="200" stroke="#A9854E" stroke-width="1.5"/>
  <!-- titular serif editorial -->
  <text x="540" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" fill="#20201D">El detalle</text>
  <text x="540" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" fill="#20201D">que convierte una prenda</text>
  <text x="540" y="650" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-style="italic" fill="#A9854E">en una marca.</text>
  <!-- pie -->
  <text x="540" y="900" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="bold" letter-spacing="6" fill="#20201D">KORMAN</text>
  <text x="540" y="940" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" letter-spacing="5" fill="#20201D" fill-opacity="0.6">COLEGIALES · CABA · ENVÍOS A TODO EL PAÍS</text>
</svg>
